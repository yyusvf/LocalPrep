name: Build & Release

# Triggers:
#   push of a version tag  →  full build + publish to GitHub Release
#   pull_request to main   →  build-only (no publish), smoke-test the pipeline
on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  # ── Windows ───────────────────────────────────────────────────────
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build (and publish on tag)
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            npx electron-builder --win --publish always
          else
            npx electron-builder --win --publish never
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # On PRs: upload as workflow artifacts instead of publishing
      - name: Upload installer artifact (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: LocalPrep-Setup-pr${{ github.event.pull_request.number }}
          path: dist/*Setup*.exe
          retention-days: 7

      - name: Upload portable artifact (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: LocalPrep-Portable-pr${{ github.event.pull_request.number }}
          path: dist/*Portable*.exe
          retention-days: 7

  # ── macOS ─────────────────────────────────────────────────────────
  build-mac:
    name: Build (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # No code signing — identity: null in package.json.
      # Users on macOS 13+ may need to right-click → Open the first time.
      - name: Build (and publish on tag)
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            npx electron-builder --mac --publish always
          else
            npx electron-builder --mac --publish never
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false   # skip signing lookup entirely

      - name: Upload macOS artifact (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: LocalPrep-mac-pr${{ github.event.pull_request.number }}
          path: dist/*.dmg
          retention-days: 7
